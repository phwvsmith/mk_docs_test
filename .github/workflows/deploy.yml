name: Deploy Docs

on:
  workflow_run:
    workflows: ["Auto Merge Docs Edits"]
    types:
      - completed

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Store pasted screenshots
        env:
          ATTACHMENT_TOKEN: ${{ secrets.ATTACHMENT_TOKEN }}
        run: python scripts/process_attachments.py

      - name: Commit stored screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs

          if ! git diff --cached --quiet; then
            git commit -m \
              "Store pasted screenshots in repository [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy
        run: mkdocs gh-deploy --force