name: Deploy Docs

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check attachment token
        env:
          ATTACHMENT_TOKEN: ${{ secrets.ATTACHMENT_TOKEN }}
        run: |
          if [ -z "$ATTACHMENT_TOKEN" ]; then
            echo "::error::ATTACHMENT_TOKEN has not been configured"
            exit 1
          fi

      - name: Store pasted screenshots
        env:
          ATTACHMENT_TOKEN: ${{ secrets.ATTACHMENT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/process_attachments.py

      - name: Deploy processed documentation
        run: mkdocs gh-deploy --force

      - name: Create pull request for stored screenshots
        env:
          GH_TOKEN: ${{ secrets.ATTACHMENT_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "No stored screenshots need committing."
            exit 0
          fi

          branch="automation/store-pasted-screenshots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add docs
          git commit -m "Store pasted screenshots in repository"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Store pasted screenshots in repository" \
            --body "Automatically downloads pasted GitHub attachments, stores them in the repository and updates the Markdown image links."
