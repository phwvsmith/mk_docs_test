name: Auto Merge Docs Edits

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate MkDocs build
        run: mkdocs build --strict

  rebase:
    needs: validate

    # Do not rebase automatically generated screenshot branches.
    # Rebasing these branches can remove the generated image commit.
    if: ${{ !startsWith(github.head_ref, 'automation/store-pasted-screenshots-') }}

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-rebase PR
        uses: peter-evans/rebase@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    needs:
      - validate
      - rebase

    # Continue when validation succeeds and rebase either succeeds
    # or is deliberately skipped for a screenshot branch.
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (
        needs.rebase.result == 'success' ||
        needs.rebase.result == 'skipped'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge via GitHub CLI
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --auto \
            --delete-branch \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
